name: Курс НБ РБ в Telegram
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-
      - run: python telegram_alerts.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          WATCH: USD,EUR,RUB
          ALERTS: ""
          ALWAYS: "1"
